<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test App For Automation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f5f5f5;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        input,
        button,
        select {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        button {
            background: #007bff;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0069d9;
        }

        .link {
            margin-top: 15px;
            display: block;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Test Automation Demo Page</h2>

        <label>Email:</label>
        <input type="text" id="email" placeholder="Enter email" />

        <label>Password:</label>
        <input type="password" id="password" placeholder="Enter password" />

        <button id="loginBtn">Login</button>

        <select id="dropdown">
            <option value="">Select Option</option>
            <option value="opt1">Option 1</option>
            <option value="opt2">Option 2</option>
        </select>

        <button id="submitBtn">Submit</button>

        <a href="#" id="sampleLink" class="link">Sample Navigation Link</a>

        <p id="status" style="margin-top:15px; font-weight:bold;"></p>
    </div>

    <script>
        document.getElementById("loginBtn").onclick = function () {
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            if (!email || !password) {
                document.getElementById("status").innerText = "Missing credentials";
            } else {
                document.getElementById("status").innerText = "Login successful";
            }
        };

        document.getElementById("submitBtn").onclick = function () {
            const dd = document.getElementById("dropdown").value;
            if (!dd) {
                document.getElementById("status").innerText = "Select an option";
            } else {
                document.getElementById("status").innerText = "Submitted: " + dd;
            }
        };
    </script>
</body>

</html>
