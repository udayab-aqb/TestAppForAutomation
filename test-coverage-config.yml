# Test Coverage Report Configuration
# This file defines metrics, calculations, and checkpoints for test coverage reporting

report:
  name: "Selenium Test Automation Coverage Report"
  project: "TestAppForAutomation"
  framework: "Selenium Java with Page Object Model"
  generated_date: "auto"  # Auto-populate with current date

# =============================================================================
# TEST FILES CONFIGURATION
# =============================================================================
test_files:
  # Test directory to scan
  test_directory: "src/test/java"
  
  # Auto-discovery settings
  auto_discover: true  # Automatically scan test directory for test files
  exclude_patterns:
    - "**/BaseTest.java"  # Exclude base test classes
    - "**/Abstract*.java"  # Exclude abstract classes
  
  # Test naming patterns
  test_file_pattern: "*Test.java"
  test_method_pattern: "test*"
  
  # Summary table settings
  summary_table:
    show_compliance_score: true
    show_test_count: true
    show_status_icon: true
    compliance_threshold:
      excellent: 90  # >= 90% = ✅
      good: 70       # >= 70% = ⚠️
      poor: 0        # < 70% = ❌
  
# =============================================================================
# METRICS TRACKING
# =============================================================================
metrics:
  # Core Test Metrics
  total_test_cases: 10
  automated_test_cases: 8
  manual_test_cases: 2
  
  # Coverage Calculations
  automation_coverage_percent: 80  # (automated_test_cases / total_test_cases) × 100
  manual_coverage_percent: 20      # (manual_test_cases / total_test_cases) × 100
  
  # Test Execution Metrics
  passed_tests: 0      # Update after test run
  failed_tests: 0      # Update after test run
  skipped_tests: 0     # Update after test run
  
  # Quality Metrics
  test_pass_rate: 0    # (passed_tests / automated_test_cases) × 100
  
  # Benchmark Targets
  targets:
    automation_coverage_target: 100
    test_pass_rate_target: 95
    code_coverage_target: 80

# =============================================================================
# CALCULATION FORMULAS
# =============================================================================
calculations:
  automation_coverage:
    formula: "(automated_test_cases / total_test_cases) × 100"
    description: "Percentage of test cases that are automated"
    
  manual_coverage:
    formula: "(manual_test_cases / total_test_cases) × 100"
    description: "Percentage of test cases that remain manual"
    
  test_pass_rate:
    formula: "(passed_tests / automated_test_cases) × 100"
    description: "Percentage of automated tests that passed"
    
  test_failure_rate:
    formula: "(failed_tests / automated_test_cases) × 100"
    description: "Percentage of automated tests that failed"
    
  automation_gap:
    formula: "total_test_cases - automated_test_cases"
    description: "Number of tests still requiring automation"

# =============================================================================
# QUALITY CHECKPOINTS
# =============================================================================
checkpoints:
  
  # 1. Framework Coverage & Maturity
  framework_coverage:
    - name: "Automation Coverage ≥ 70%"
      status: "pass"  # pass/fail/warning
      current_value: 80
      target_value: 70
      priority: "high"
      
    - name: "Test Documentation Complete"
      status: "pass"
      description: "All test cases documented in TEST_CHECKLIST.md"
      priority: "medium"
      
    - name: "Framework Structure Follows POM"
      status: "pass"
      description: "Page Object Model properly implemented"
      priority: "high"
  
  # 2. Test Case Quality (Pre-Automation)
  test_case_quality:
    - name: "QA Lead Approval"
      description: "Test case valid and approved by QA Lead"
      required: true
      
    - name: "Preconditions Documented"
      description: "All test preconditions clearly documented"
      required: true
      
    - name: "Test Data Defined"
      description: "Test data requirements specified"
      required: true
      
    - name: "Positive & Negative Cases"
      description: "Both positive and negative scenarios identified"
      required: true
      
    - name: "Edge Cases Listed"
      description: "Edge cases documented and planned"
      required: true
      
    - name: "Selectors Verified"
      description: "XPaths/IDs checked and documented"
      required: true
      
    - name: "Automation Feasibility"
      description: "Confirmed test can be automated"
      required: true
  
  # 3. Code Quality (Pre-Merge)
  code_quality:
    pom_structure:
      - name: "Page Class Location"
        description: "Page class in /src/main/java/pages/"
        required: true
        
      - name: "Locators at Top"
        description: "All locators defined at class top"
        required: true
        
      - name: "Meaningful Method Names"
        description: "Methods have clear, descriptive names"
        required: true
        
      - name: "No Assertions in Page Objects"
        description: "Page objects contain zero assertions"
        required: true
        
      - name: "No Test Logic in Pages"
        description: "Test logic separated from page classes"
        required: true
    
    test_class:
      - name: "Extends BaseTest"
        description: "Test class extends BaseTest"
        required: true
        
      - name: "Assertions in Test Only"
        description: "Assertions only in test class, not page objects"
        required: true
        
      - name: "Proper Waits"
        description: "Explicit/implicit waits used, no Thread.sleep"
        required: true
        
      - name: "No Hard-coded Data"
        description: "All data from config files"
        required: true
        
      - name: "Config-driven URLs"
        description: "URLs and credentials from config"
        required: true
        
      - name: "Screenshot on Failure"
        description: "Screenshots captured for failed tests"
        required: true
  
  # 4. Selector Strategy
  selector_quality:
    - name: "No Absolute XPaths"
      description: "No XPaths like /html/body/..."
      required: true
      priority: "high"
      
    - name: "Stable Attributes"
      description: "Use meaningful, stable attributes"
      required: true
      priority: "high"
      
    - name: "Avoid Index Selectors"
      description: "No selectors like (//button)[3]"
      required: true
      priority: "medium"
      
    - name: "Minimal XPath Functions"
      description: "Use contains(), starts-with() only when needed"
      required: true
      priority: "low"
      
    - name: "Text-based for Unique Elements"
      description: "Use text-based XPath for unique UI elements"
      required: false
      priority: "medium"

# =============================================================================
# SELECTOR PREFERENCE HIERARCHY
# =============================================================================
selector_preference:
  order:
    1: "ID"
    2: "Name"
    3: "CSS Selector"
    4: "XPath (only when needed)"
  
  examples:
    good_xpaths:
      - "//input[@id='email']"
      - "//*[@data-testid='login-btn']"
      - "//button[contains(text(),'Submit')]"
    
    bad_xpaths:
      - "/html/body/div[1]/div[2]/button"  # Absolute path
      - "(//button)[3]"                     # Index-based
      - "//div/div/div/span/button"         # Too deep, brittle

# =============================================================================
# COMPLIANCE TRACKING
# =============================================================================
compliance:
  categories:
    - name: "POM Structure"
      compliance_percent: 100
      status: "compliant"
      notes: "All page objects follow standards"
      
    - name: "Selector Strategy"
      compliance_percent: 95
      status: "mostly_compliant"
      notes: "Minor XPath optimizations needed"
      
    - name: "Test Standards"
      compliance_percent: 100
      status: "compliant"
      notes: "All tests extend BaseTest"
      
    - name: "Documentation"
      compliance_percent: 90
      status: "mostly_compliant"
      notes: "Some test cases need better comments"
      
    - name: "Code Review"
      compliance_percent: 100
      status: "compliant"
      notes: "All PRs follow checklist"

# =============================================================================
# RISK ASSESSMENT
# =============================================================================
risk_assessment:
  low_risk:
    - "Framework structure is solid and maintainable"
    - "Good separation of concerns (POM pattern)"
    - "Proper configuration management"
    
  medium_risk:
    - "20% tests still manual (dependency on manual QA)"
    - "Some complex XPaths may be brittle"
    
  high_risk: []
  
  mitigation_strategies:
    - "Prioritize automation of remaining manual tests"
    - "Periodic XPath health check and refactoring"
    - "Increase test data coverage for edge cases"

# =============================================================================
# RECOMMENDATIONS
# =============================================================================
recommendations:
  short_term:
    timeline: "Next Sprint"
    items:
      - "Automate remaining 2 manual test cases to achieve 100% coverage"
      - "Review and refactor XPaths to ensure compliance with selector standards"
      - "Add more edge case scenarios for critical user flows"
      
  medium_term:
    timeline: "Next Quarter"
    items:
      - "Implement data-driven testing for scenarios with multiple data sets"
      - "Enhance reporting with detailed test execution logs"
      - "Cross-browser testing setup (Chrome, Firefox, Edge)"
      
  long_term:
    timeline: "Next 6 Months"
    items:
      - "Parallel test execution to reduce execution time"
      - "API test integration for end-to-end coverage"
      - "Performance testing integration"

# =============================================================================
# REPORT GENERATION SETTINGS
# =============================================================================
report_generation:
  output_format: "markdown"  # markdown, html, json, pdf
  output_file: "TEST_COVERAGE_REPORT.md"
  include_sections:
    - "executive_summary"
    - "metrics_overview"
    - "coverage_breakdown"
    - "quality_checkpoints"
    - "compliance_status"
    - "risk_assessment"
    - "recommendations"
    - "trend_analysis"
  
  charts:
    - type: "pie"
      title: "Automation Coverage"
      data: ["automated_test_cases", "manual_test_cases"]
      
    - type: "bar"
      title: "Compliance by Category"
      data: ["compliance.categories"]
      
    - type: "line"
      title: "Coverage Trend"
      data: "historical_coverage"  # Track over time

# =============================================================================
# HISTORICAL TRACKING (for trend analysis)
# =============================================================================
historical_data:
  - date: "2025-12-11"
    total_tests: 10
    automated_tests: 8
    coverage_percent: 80
    pass_rate: 0
    
  # Add more entries over time to track trends
  # - date: "2025-12-18"
  #   total_tests: 12
  #   automated_tests: 10
  #   coverage_percent: 83
  #   pass_rate: 95

# =============================================================================
# INTEGRATION SETTINGS
# =============================================================================
integration:
  # CI/CD Integration
  jenkins:
    enabled: true
    allure_results_path: "target/allure-results"
    
  # Notification Settings
  notifications:
    email:
      enabled: false
      recipients: []
    
    slack:
      enabled: false
      webhook_url: ""
      channel: "#qa-reports"
  
  # Report Publishing
  publish:
    jenkins_artifacts: true
    github_pages: false
    confluence: false
