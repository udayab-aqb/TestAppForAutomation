name: Generate Test Coverage Report

on:
  # Run on push to main/develop branches
  push:
    branches:
      - main
      - develop*
      - master
  
  # Run on pull requests
  pull_request:
    branches:
      - main
      - develop*
      - master
  
  # Run on schedule (weekly on Monday at 9 AM)
  schedule:
    - cron: '0 9 * * 1'
  
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      update_metrics:
        description: 'Update metrics from test results'
        required: false
        default: 'false'

jobs:
  generate-coverage-report:
    name: Generate Test Coverage Report
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml
      
      - name: Generate Coverage Report
        run: |
          python generate_coverage_report.py test-coverage-config.yml TEST_COVERAGE_REPORT.md src/test/java
      
      - name: Display Report Summary
        run: |
          echo "## 📊 Test Coverage Report Generated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Key Metrics" >> $GITHUB_STEP_SUMMARY
          
          # Extract metrics from YAML
          TOTAL_TESTS=$(grep "total_test_cases:" test-coverage-config.yml | awk '{print $2}')
          AUTO_TESTS=$(grep "automated_test_cases:" test-coverage-config.yml | awk '{print $2}')
          COVERAGE=$(grep "automation_coverage_percent:" test-coverage-config.yml | awk '{print $2}')
          
          echo "- **Total Test Cases:** $TOTAL_TESTS" >> $GITHUB_STEP_SUMMARY
          echo "- **Automated Tests:** $AUTO_TESTS" >> $GITHUB_STEP_SUMMARY
          echo "- **Coverage:** $COVERAGE%" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Full report available in [TEST_COVERAGE_REPORT.md](TEST_COVERAGE_REPORT.md)" >> $GITHUB_STEP_SUMMARY
      
      - name: Upload Coverage Report as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage-report
          path: TEST_COVERAGE_REPORT.md
          retention-days: 30
      
      - name: Commit Report (if changed)
        if: github.event_name != 'pull_request'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          if [ -n "$(git status --porcelain TEST_COVERAGE_REPORT.md)" ]; then
            git add TEST_COVERAGE_REPORT.md
            git commit -m "chore: update test coverage report [skip ci]"
            git push
          else
            echo "No changes to commit"
          fi
      
      - name: Comment on PR (if PR)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            // Read YAML config
            const yaml = require('js-yaml');
            const config = yaml.load(fs.readFileSync('test-coverage-config.yml', 'utf8'));
            
            const metrics = config.metrics;
            const coverage = (metrics.automated_test_cases / metrics.total_test_cases * 100).toFixed(1);
            
            const comment = `## 📊 Test Coverage Report
            
            ### Metrics
            - **Total Test Cases:** ${metrics.total_test_cases}
            - **Automated Tests:** ${metrics.automated_test_cases}
            - **Manual Tests:** ${metrics.manual_test_cases}
            - **Automation Coverage:** ${coverage}%
            
            ${coverage >= 80 ? '✅' : '⚠️'} Coverage target: 70% | Current: ${coverage}%
            
            📄 Full report available in workflow artifacts.
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  # Optional: Update metrics from test execution results
  update-metrics-from-tests:
    name: Update Metrics from Test Results
    runs-on: ubuntu-latest
    if: github.event.inputs.update_metrics == 'true' || github.event_name == 'push'
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
      
      - name: Run Tests with Maven
        run: |
          mvn clean test
        continue-on-error: true
      
      - name: Extract Test Results
        run: |
          # Parse TestNG results to update metrics
          if [ -f "target/surefire-reports/testng-results.xml" ]; then
            PASSED=$(grep -oP 'passed="\K[0-9]+' target/surefire-reports/testng-results.xml | head -1)
            FAILED=$(grep -oP 'failed="\K[0-9]+' target/surefire-reports/testng-results.xml | head -1)
            SKIPPED=$(grep -oP 'skipped="\K[0-9]+' target/surefire-reports/testng-results.xml | head -1)
            
            echo "Test Results:"
            echo "Passed: $PASSED"
            echo "Failed: $FAILED"
            echo "Skipped: $SKIPPED"
            
            # Update YAML file with test results
            python3 << EOF
import yaml

with open('test-coverage-config.yml', 'r') as f:
    config = yaml.safe_load(f)

config['metrics']['passed_tests'] = ${PASSED:-0}
config['metrics']['failed_tests'] = ${FAILED:-0}
config['metrics']['skipped_tests'] = ${SKIPPED:-0}

with open('test-coverage-config.yml', 'w') as f:
    yaml.dump(config, f, default_flow_style=False, sort_keys=False)

print("✅ Metrics updated with test results")
EOF
          fi
      
      - name: Commit Updated Metrics
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          if [ -n "$(git status --porcelain test-coverage-config.yml)" ]; then
            git add test-coverage-config.yml
            git commit -m "chore: update test metrics from execution results [skip ci]"
            git push
          fi
